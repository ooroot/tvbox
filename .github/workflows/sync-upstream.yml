name: 同步上游到 tvbox

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 取 tvbox 分支
        uses: actions/checkout@v7
        with:
          ref: tvbox
          fetch-depth: 0

      - name: 合并上游到 tvbox
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/qist/tvbox.git 2>/dev/null || true
          git fetch upstream master
          if git merge --no-edit upstream/master; then
            echo "合并干净"
          else
            echo "有冲突，按规则解决：CNAME、README.md、run.yml 留 tvbox 版，其他取上游版"
            git diff -z --name-only --diff-filter=U | while IFS= read -r -d '' f; do
              if [ "$f" = "CNAME" ] || [ "$f" = "README.md" ] || [ "$f" = ".github/workflows/run.yml" ]; then
                git checkout --ours -- "$f"
              else
                git checkout --theirs -- "$f"
              fi
            done
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "仍有未解决的冲突，停止"
              exit 1
            fi
            git add -A
            if git diff --cached --quiet; then
              git merge --abort
              echo "解决后无变化，放弃合并"
            else
              git commit --no-edit
            fi
          fi
          git push origin tvbox
